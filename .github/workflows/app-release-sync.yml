# The maintainer's app merge is the release decision (D-RELEASE-001).
# Authenticate the payload against the app workflow's immutable artifact,
# then merge a manifest-only PR. Explicit dispatches follow because a
# GITHUB_TOKEN merge does not trigger push workflows.
name: App release sync
on:
  repository_dispatch:
    types: [app-image-published]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Source build client_payload JSON (ref, commit, records)'
        required: true
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: app-release-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2
      - name: Authenticate source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          set -euo pipefail
          payload="${MANUAL_PAYLOAD:-$DISPATCH_PAYLOAD}"
          printf '%s' "$payload" > "$RUNNER_TEMP/app-payload.json"
          python3 tools/verify_app_release.py "$RUNNER_TEMP/app-payload.json"
          ref=$(jq -r .ref "$RUNNER_TEMP/app-payload.json")
          if [ "$ref" = main ]; then channel=stable; else channel=dev; fi
          echo "base=$ref" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.base }}
      - name: Apply and validate manifest
        run: |
          python3 tools/sync_app_release.py --payload "$(cat "$RUNNER_TEMP/app-payload.json")"
          make contracts
      - name: Merge verified manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.source.outputs.base }}
          CHANNEL: ${{ steps.source.outputs.channel }}
        run: |
          set -euo pipefail
          # Authenticate immediately before committing too: a queued older run must not roll back the feed.
          commit=$(jq -r .commit "$RUNNER_TEMP/app-payload.json")
          test "$(gh api "repos/ashipaek0/Epilykos/branches/$BASE" --jq .commit.sha)" = "$commit"
          if [ -n "$(git status --porcelain -- manifests release)" ]; then
            branch="app-sync/${CHANNEL}"
            git config user.name ashipaek0
            git config user.email folabiklan@gmail.com
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              git fetch origin "$branch:refs/remotes/origin/$branch"
            fi
            git checkout -B "$branch"
            git add "manifests/${CHANNEL}.yaml" "release/digest-records/${BASE}.json"
            git commit -m "app(${CHANNEL}): verified release ${commit:0:7}"
            git push --force-with-lease origin "$branch"
            head=$(git rev-parse HEAD)
            number=$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')
            if [ -z "$number" ]; then
              gh pr create --base "$BASE" --head "$branch" --title "App ${CHANNEL} release ${commit:0:7}" --body "Verified against the successful app build's immutable digest artifact. Contract checks passed. Automatic release after the maintainer's source merge (D-RELEASE-001)."
              number=$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number')
            fi
            gh pr merge "$number" --merge --match-head-commit "$head"
          fi
          # Also recover a previous run which merged but failed before publication.
          gh workflow run app-manifest-publish.yml --ref "$BASE"
          if [ "$CHANNEL" = stable ]; then
            gh workflow run os-build.yml --ref main -f board=raspberrypi3 -f channel=stable
          fi
