# EpilykosOS SD card image layout, protocol 2 (OS updates; development).
#
# Same card as genimage.cfg (fixed MBR, disk signature 0x45504c4b, BOOT at
# 8 MiB, ROOT-A/ROOT-B 1536 MiB each, DATA), with three differences:
#
# - BOOT has no Linux Image: U-Boot loads the kernel and the Linux DTB from
#   the ROOT slot it boots (/usr/lib/epilykos/boot, boot-slot.cmd), so an
#   OS update replaces kernel and rootfs together. bcm2837-rpi-3-b.dtb
#   stays on BOOT exactly as on protocol-1 cards; boot.scr never loads it.
# - BOOT carries os-index-root.pem, the offline OS index root's public key
#   the shared trust policy is verified against (fixed until reflash).
# - The two redundant U-Boot environment copies at 4 MiB ship seeded
#   (post-image.sh, tools/os_bootstrap.py) instead of zeroed.
#
# Keep everything else identical to genimage.cfg
# (tools/test_card_image.py compares them).

image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/start.elf",
			"rpi-firmware/config.txt",
			"u-boot.bin",
			"boot.scr",
			"bcm2837-rpi-3-b.dtb",
			"os-index-root.pem",
			"wifi-example.txt"
		}
	}
	size = 128M
}

# DATA ships as a small empty ext4 filesystem; epilykos-data-grow grows
# the partition and the filesystem to the card's size on first boot.
image data.ext4 {
	ext4 {
		label = "DATA"
		use-mke2fs = true
	}
	empty = true
	size = 512M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = "0x45504c4b"
		align = 1M
	}

	# Two 16 KiB records (uboot.fragment, /etc/fw_env.config), outside the
	# partition table, before BOOT.
	partition uboot-env-a {
		in-partition-table = false
		offset = 4M
		image = "env-a.bin"
		size = 16K
	}

	partition uboot-env-b {
		in-partition-table = false
		offset = 4112K
		image = "env-b.bin"
		size = 16K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 8M
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1536M
	}

	partition rootfs-b {
		partition-type = 0x83
		# post-image.sh copies rootfs.ext4 and relabels the copy ROOT-B.
		image = "rootfs-b.ext4"
		size = 1536M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
