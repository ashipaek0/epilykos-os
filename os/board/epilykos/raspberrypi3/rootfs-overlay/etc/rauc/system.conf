# RAUC system configuration — Raspberry Pi 3B (Tier 1).
#
# STATUS: untested scaffold — no signing key exists yet (Stage 5,
# C-UPDATE-004). This makes `rauc install` structurally correct to try
# against, not a working signed-update path.

[system]
compatible=epilykos-raspberrypi3
bootloader=uboot
data-directory=/data/rauc
statusfile=/data/rauc/slot-status.raucs

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-label/RootFS-A
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-label/RootFS-B
type=ext4
bootname=B
