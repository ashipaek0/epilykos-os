# RAUC system configuration — protocol-2 cards (OS updates from Settings).
# Replaces the rootfs-overlay file on protocol-2 images (post-build.sh).
#
# Slots are addressed by PARTUUID (fixed disk signature 0x45504c4b); the
# booted slot comes from rauc.slot= on the kernel command line, set by
# boot-slot.cmd. Each slot carries its own kernel and DTB, so installing
# the rootfs image installs the whole OS (design §4).

[system]
compatible=epilykos-raspberrypi3
bootloader=uboot
mountprefix=/run/rauc/mnt
data-directory=/data/rauc
# C-BOOT-002: explicit, and equal to the reset value boot-slot.cmd uses.
boot-attempts=3
boot-attempts-primary=3
# Only verity bundles: their manifest is inside the signature and their
# payload is checked block by block while it is read (design §6.1).
bundle-formats=verity
# Installing never changes the boot target; the OS update job activates
# a ready slot explicitly, after the administrator's Restart (design §7.2).
activate-installed=false

# The effective keyring is generated before RAUC starts from the shared
# root-signed trust policy in the U-Boot environment (epilykos-os-keyring,
# design §6.3). There is no slot-local fallback: without a verified policy
# the file is absent and RAUC refuses every bundle, while status and
# mark-good keep working.
[keyring]
path=/run/rauc/epilykos-keyring.pem
# The Pi may have no clock: certificates are checked at the bundle's
# signing time. Revocation is the trust policy's job, not expiry's.
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/disk/by-partuuid/45504c4b-02
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/45504c4b-03
type=ext4
bootname=B
