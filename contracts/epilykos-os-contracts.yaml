test_fixture_notes:
- tests:
  - T-RUNTIME-001
  - C-DATA-002 evidence
  - C-NET-001 evidence
  note: These intentionally exercise overlapping offline-boot conditions from different contract perspectives. CI SHOULD reuse
    one network-isolated cold-boot fixture and record distinct assertions rather than build separate rigs.
decision_governance:
  ordering: The registry is ordered by due_stage then decision ID; list position is not priority.
  stage_0_rule: Stage 0 MUST review the complete open decision registry and confirm each decision's due_stage. Only decisions
    due at Stage 0 must be resolved before Stage 0 closes.
  stage_close_rule: A stage MUST NOT close while any open decision with due_stage less than or equal to that stage remains
    unresolved.
  late_added_rule: A decision added in a later contract revision receives the same review and gating semantics as an older
    decision; revision age has no effect on priority.
