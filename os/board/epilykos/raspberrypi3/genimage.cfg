# EpilykosOS SD card image layout — Raspberry Pi 3B.
#
# Partition topology per contracts/epilykos-os-contracts.yaml C-BOOT-001:
# one shared BOOT partition (kernel/dtb/boot.scr are not duplicated per
# slot, so a slot switch never risks a kernel/rootfs version mismatch —
# see the note in boot.cmd), two ROOT slots, one DATA partition.
#
# Sizes below are placeholders, not the frozen D-STORAGE-001 decision
# (still open — see the decision registry). They exist so this file
# parses and a first test image can be produced; they are not evidence
# that these sizes fit a real card's endurance/capacity budget.
#
# STATUS: untested. File names under `files = {}` are Buildroot's usual
# staging layout for the rpi-firmware/uboot/linux packages, but have not
# been confirmed against an actual build output tree.

image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"bootcode.bin",
			"fixup.dat",
			"start.elf",
			"overlays",
			"config.txt",
			"u-boot.bin",
			"boot.scr",
			"zImage",
			"broadcom/bcm2837-rpi-3-b.dtb"
		}
	}
	size = 96M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition uboot-env {
		partition-type = 0x83
		image = "uboot.env"
		size = 16K
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 768M
	}

	partition rootfs-b {
		partition-type = 0x83
		# post-image.sh duplicates rootfs.ext4 (labeled RootFS-A by the
		# ext2 target options) into rootfs-b.ext4 and relabels it
		# RootFS-B — genimage itself has no relabel hook, and the two
		# slots can't share one label if boot.cmd selects by LABEL=.
		# ROOT-B starts as a copy of ROOT-A on first flash; the first
		# real application update is what actually writes something
		# different here via RAUC.
		image = "rootfs-b.ext4"
		size = 768M
	}

	partition data {
		partition-type = 0x83
		size = 512M
		# Left unformatted at image-build time; formatted and grown to
		# fill the card by a first-boot service, not baked into the
		# image (card capacity varies; C-DATA-001/D-STORAGE-001).
	}
}
