# BlueZ settings for EpilykosOS. Everything the box does over Bluetooth is
# Low Energy: Wi-Fi setup (Improv) and the app's BMS/inverter links. With
# the classic (BR/EDR) side off, desktops can no longer pair with the box
# as an audio or network device; once a laptop had, BlueZ there listed its
# classic services instead of the advertised Improv service and Chrome's
# Wi-Fi setup no longer found it. epilykos-improv also turns pairing off.
[General]
ControllerMode = le
AlwaysPairable = false

[Policy]
AutoEnable = true
