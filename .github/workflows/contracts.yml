name: Contracts

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-env:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Native integration build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bison flex m4 patch meson ninja-build pkg-config libglib2.0-dev libssl-dev
      - name: Pinned fw-tools, RAUC bootchooser and ARM64 loader guard
        run: make test-native-env

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2 dbus-fast==4.0.4
      - name: Validator self-tests
        run: make test
      - name: Validate contracts
        run: make contracts
