# Protocol-2 cards: every RAUC start (including the restart after a new
# trust policy is admitted) first regenerates its keyring from the current
# verified policy. A failure removes the keyring rather than stopping RAUC,
# so installs are refused while status and mark-good still work.
[Unit]
After=boot.mount

[Service]
ExecStartPre=-/usr/bin/epilykos-os-keyring
