# The dashboard may be moved to port 80 in Epilykos settings so that
# http://epilykos.local works with no port. The app runs unprivileged in
# its container (host network), so let ordinary users bind from 80 up.
# Nobody but the app and the epilykos admin login run on this box.
net.ipv4.ip_unprivileged_port_start = 80
