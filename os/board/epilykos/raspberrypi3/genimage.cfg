# EpilykosOS SD card image layout — Raspberry Pi 3B.
#
# Topology per C-BOOT-001: one shared BOOT partition, two equal ROOT
# slots, one DATA partition. Four primary MBR partitions, no extended
# partition. (C-BOOT-001 asks for GPT; the Pi 3B boot ROM needs an MBR
# entry for BOOT, so GPT here would mean a hybrid MBR. That is tracked on
# C-BOOT-001 rather than done silently.)
#
#   0      - 4 MiB    MBR, then unused
#   4 MiB  - 4 MiB+32K U-Boot environment, two redundant 16 KiB copies
#                     (uboot.fragment, /etc/fw_env.config)
#   8 MiB             p1 BOOT   FAT32: firmware, U-Boot, boot.scr, Image, DTB
#                     p2 ROOT-A ext4
#                     p3 ROOT-B ext4 (same image as ROOT-A on first flash)
#                     p4 DATA   ext4, grown to fill the card on first boot
#
# The disk signature is fixed so partitions have stable PARTUUIDs
# (45504c4b-01 … -04, "EPLK"); boot.cmd, fstab and RAUC's system.conf
# all address partitions by them. genimage's default signature is 0,
# which gave every flashed card PARTUUIDs 00000000-0N.
#
# Sizes are placeholders, not the frozen D-STORAGE-001 decision.
#
# File paths under `files = {}` are relative to $BINARIES_DIR: the
# rpi-firmware package stages its blobs and our config.txt under
# rpi-firmware/; the kernel's Image and DTB, u-boot.bin and boot.scr sit
# directly in $BINARIES_DIR. Only each entry's basename lands in the FAT.

image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/start.elf",
			"rpi-firmware/config.txt",
			"u-boot.bin",
			"boot.scr",
			"Image",
			"bcm2837-rpi-3-b.dtb"
		}
	}
	size = 128M
}

# DATA ships as a small empty ext4 filesystem; epilykos-data-grow grows
# the partition and the filesystem to the card's size on first boot.
image data.ext4 {
	ext4 {
		label = "DATA"
		use-mke2fs = true
	}
	empty = true
	size = 512M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = "0x45504c4b"
		align = 1M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 8M
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1536M
	}

	partition rootfs-b {
		partition-type = 0x83
		# post-image.sh copies rootfs.ext4 and relabels the copy ROOT-B.
		image = "rootfs-b.ext4"
		size = 1536M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
