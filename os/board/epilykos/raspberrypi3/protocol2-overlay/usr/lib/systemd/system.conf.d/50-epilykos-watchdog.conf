# Protocol-2 cards (copied by post-build.sh). U-Boot arms the BCM2835
# watchdog (15 s), the kernel feeds it until PID1 opens it (at most
# watchdog.open_timeout, linux.fragment), then systemd feeds it: a hang
# anywhere from the loader on resets the board, and the boot attempt the
# loader already spent counts. 10 s stays under the 15 s hardware maximum.
[Manager]
RuntimeWatchdogSec=10s
RebootWatchdogSec=60s
