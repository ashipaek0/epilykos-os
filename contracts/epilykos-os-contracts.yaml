metadata:
  document: EPILYKOS-OS-CONTRACTS
  version: 0.7.2-draft
  architecture_baseline: EpilykosOS Appliance Architecture v0.5
  hardware_tiers:
    tier_1_tested: Raspberry Pi 3 Model B (1 GB) — the maintainer-owned board; all release-gating hardware evidence comes
      from it.
    tier_2_best_effort:
    - Raspberry Pi 4
    - Raspberry Pi 5
    note: Architecture v0.5 named Raspberry Pi 5 (8 GB) as the reference platform; superseded by the tier model (D-HW-001).
  tracks:
    track_1: Existing Docker Compose deployment; outside this contract
    track_2: EpilykosOS appliance; governed by this contract
  normative_terms:
    MUST: Required for the referenced stage gate to pass.
    SHOULD: Expected unless an explicit, documented exception is approved.
    MAY: Optional and non-blocking.
  supersedes: 0.4-draft
  repositories:
    application: ashipaek0/epilykos (Track 1 product; source of the OCI images)
    os: epilykos-os (Track 2 product; this contract, image build, RAUC, Quadlets)
  branch_model:
    dev: Integration branch in both repositories. Builds may be used by developer images and the dev channel only.
    main: Stable releases only, merged from dev. Only main builds may be referenced by stable appliance releases.
frozen_invariants:
- id: I-001
  requirement: Track 1 and Track 2 remain separate deployment products.
  verification: Repository documentation and release artifacts distinguish Docker Compose from EpilykosOS.
- id: I-002
  requirement: Developer and appliance EpilykosOS images use the same boot chain and partition topology.
  verification: Partition-table and boot-artifact comparison test.
- id: I-003
  requirement: EpilykosOS and Epilykos application updates are independent rollback domains.
  verification: Independent forced-failure rollback tests for RAUC and OCI planes.
- id: I-004
  requirement: The appliance boots and starts Epilykos with no Ethernet link, no configured Wi-Fi, and no Internet.
  verification: Offline boot acceptance test.
- id: I-005
  requirement: Persistent user data is never stored only inside ROOT-A or ROOT-B.
  verification: Filesystem scan plus A/B rollback persistence test.
- id: I-006
  requirement: Production appliance images MUST NOT use privileged=true for the Epilykos container (which owns Bluetooth
    access) unless a reviewed exception is recorded.
  verification: Static Quadlet scan and Stage 3 hardware test evidence.
- id: I-007
  requirement: 'Neither update plane may activate a candidate solely on unauthenticated metadata: OS bundles and application
    manifests both require an explicit trust decision before activation.'
  verification: RAUC signature-rejection tests plus application-manifest trust/rejection tests.
- id: I-008
  requirement: Externally supplied application manifests are replay-protected by a monotonic release sequence stored on DATA;
    internal previous-known-good rollback remains independently available.
  verification: Application-manifest replay rejection plus internal rollback tests.
- id: I-009
  requirement: Stable appliance releases reference only application images built from the Epilykos main branch; images built
    from dev are limited to developer images and the explicitly labelled dev channel.
  verification: 'Manifest provenance check: every digest in a stable manifest matches a digest record whose ref is main.'
- id: I-010
  requirement: Initial Pi 3B platform/recovery evidence and targeted revalidation come from Tier 1. Ordinary stable
    publication is automated without per-image manual approval. Later Tier 2 support is pinned upstream and never
    described as hardware-tested without evidence.
  verification: Evidence files name the board; release notes state the support level per board; Tier 2 board-support
    sources are pinned upstream references.
contracts:
- id: C-HW-001
  title: Hardware support tiers
  stage: 0
  status: draft
  requirements:
  - Pi 3 Model B (1 GB) is the v1 reference board. Initial platform/recovery evidence and targeted revalidation
    of changed mechanisms MUST use it; routine images MUST NOT require manual testing or approval.
  - Complete Pi 3B first, then add Pi 4 and Pi 5 as non-blocking best-effort targets. Each board MUST have its own
    pinned upstream support, image, automated validation and RAUC compatible identity.
  - Share logical A/B rollback and persistent DATA semantics; select physical boot layout and recovery from maintained
    upstream support per board. Pi 3B MBR and bootloader details MUST NOT be assumed applicable to every board.
  - A failed board build MUST prevent publication of its artifact without suppressing a valid Pi 3B artifact. Pi
    4/5 MUST NOT delay Pi 3B v1.
  - Release notes MUST identify hardware-tested board revisions and label hardware-unverified best-effort images
    honestly. Community evidence is accepted; it is not a manual gate for every later image.
  - Tier 2-only capabilities MUST remain optional. Pi 4/5 images MUST NOT be offered before their board configuration
    and automated validation exist.
  evidence:
  - CI build logs for every Tier 1 and Tier 2 image
  - Pinned upstream board-support references (repository + revision) per Tier 2 board
  - Release notes support table
  rationale: The maintainer can only test on a Raspberry Pi 3B. Tier 2 support therefore relies on code other projects
    already run on those boards, rather than untested Epilykos-specific low-level work.
  implementation_status:
  - Only the Pi 3B board configuration exists. Pi 4/5 work and initial complete Pi 3B acceptance remain pending.
- id: C-BOOT-000
  title: Boot-chain and build-system feasibility spike
  stage: 0
  status: blocked-on-spike
  requirements:
  - 'Before Stage 0 closes, the chosen A/B boot chain MUST be demonstrated on the Tier 1 board (Raspberry Pi 3B) with its
    v1 boot medium: select ROOT-A and ROOT-B, fall back after a failed boot, and boot with no network.'
  - The spike MUST evaluate U-Boot + RAUC bootchooser (as specified by C-BOOT-002) on Tier 1. For Tier 2 boards the boot mechanism
    is the one the selected upstream project already uses on that board; Tier 2 is build-verified only unless community evidence
    exists (C-HW-001).
  - The spike MUST record the build system selected by D-PLATFORM-001 and the effort to maintain it (kernel/firmware update
    cadence, CVE response).
  - Contracts that name a specific bootloader (C-BOOT-002, C-RECOVERY-001) MUST be revised through review if the spike selects
    a different mechanism; they MUST NOT be silently reinterpreted.
  evidence:
  - evidence/stage-0/boot-chain-spike.json (board, medium, firmware/bootloader versions, slot switch + fallback results)
  - Serial console logs of both slot boots and one forced fallback
  - Written build-system comparison including Home Assistant OS (Buildroot + RAUC) as prior art
  unresolved:
  - D-PLATFORM-001
  - D-BOOT-002
  rationale: Proving the boot chain first, on the hardware that will produce all gating evidence, avoids discovering boot
    problems at Stage 4.
- id: C-BOOT-001
  title: Partition map
  stage: 0
  status: draft
  requirements:
  - Pi 3B developer and appliance images MUST use MBR with the same ordered BOOT, ROOT-A, ROOT-B and DATA topology.
    Pi 4/5 layout is selected separately with their upstream board support.
  - Required labels are BOOT, ROOT-A, ROOT-B, DATA.
  - An independent recovery environment is required in v1; its storage location MUST be designed with the protected
    boot chain. No fifth partition, size change or deployed-card migration is pre-approved.
  - ROOT-A and ROOT-B MUST be equal size.
  - 'Sizes and filesystems are frozen by D-STORAGE-001: BOOT 128 MiB FAT32, ROOT-A and ROOT-B 1536 MiB ext4 each,
    DATA ext4 filling the rest of a card of at least 32 GB.'
  - DATA MUST be a separate persistent filesystem and MUST survive OS slot switches and application rollbacks.
  - 'The Tier 1 v1 boot medium is the microSD card: USB mass-storage boot on the original Pi 3B requires a one-time
    OTP setting and MUST NOT be assumed. Tier 2 boards MAY use USB or NVMe media supported by their upstream board
    support.'
  - ROOT-A and ROOT-B MUST remain mounted read-only in normal operation. Controlled host update/repair operations
    may write an inactive slot or approved boot artifacts; DATA remains the normal persistent writable state.
  - DATA MUST be checked and repaired automatically at boot (fsck -p semantics); a DATA check failure MUST NOT stop
    the box from booting to a state where the dashboard reports the problem.
  implementation_status:
  - Current image uses four primary MBR partitions and fixed disk signature 0x45504c4b. MBR is now approved for
    Pi 3B; there is no outstanding GPT exception.
  - Current sizes remain BOOT 128 MiB, each ROOT 1536 MiB, DATA filling the remaining card. Recovery/boot-chain
    storage feasibility and safe adoption are pending; these sizes MUST NOT silently be changed.
  evidence:
  - parted -s <image> unit B print
  - blkid output from first boot
  - CI assertion that developer/appliance partition tables are identical
  - 'Repeated power cuts during writes: ROOT stays clean (fsck -n) and DATA is repaired at boot'
- id: C-BOOT-002
  title: U-Boot / RAUC bootchooser variables
  stage: 4
  status: draft
  requirements:
  - Raspberry Pi firmware MUST boot U-Boot; U-Boot MUST select the boot slot before Linux starts.
  - The bootchooser MUST use BOOT_ORDER and BOOT_<slot>_LEFT variables compatible with RAUC's U-Boot backend.
  - RAUC in userspace MUST be the only normal runtime component that mutates slot-good/bad state.
  - boot-attempts and boot-attempts-primary MUST be explicit configuration values; defaults are not acceptable.
  - Loss or corruption of the U-Boot environment MUST have a documented deterministic recovery behavior.
  - The Linux kernel, Linux DTB, modules and rootfs MUST form one update/rollback unit in each ROOT slot; U-Boot
    MUST load the selected slot artifacts rather than a shared BOOT Linux image.
  implementation_status:
  - 'U-Boot 2025.10 (rpi_3, AArch64) runs boot.scr, which follows RAUC''s reference U-Boot script: BOOT_ORDER, BOOT_A_LEFT,
    BOOT_B_LEFT, root=PARTUUID and rauc.slot= on the kernel command line.'
  - 'Environment storage (D-BOOT-001): raw on the SD card in two redundant 16 KiB copies at 4 MiB and 4 MiB + 16
    KiB, ahead of the first partition; /etc/fw_env.config gives fw_setenv (RAUC) the same locations. A blank or
    corrupt environment falls back to U-Boot defaults and boot.cmd re-initialises A B / 3 / 3.'
  - RAUC system.conf sets boot-attempts=3 and boot-attempts-primary=3 explicitly (locked values).
  - Linux Image/DTB currently remain on shared BOOT; moving them into each slot and enabling/verifying ext4 loading
    is required and not yet implemented.
  evidence:
  - U-Boot environment dump before/after install
  - Forced boot-failure test showing attempt decrement
  - RAUC status output matched to U-Boot environment
  - Corrupt/lost U-Boot environment recovery test
  unresolved:
  - Exact boot-attempts value
  - Exact boot-attempts-primary value
  - U-Boot environment storage location and redundancy strategy
- id: C-BOOT-003
  title: Mark-good conditions
  stage: 4
  status: draft
  requirements:
  - Normal slot confirmation MUST require local userspace, mounted DATA, operational Podman and a healthy Epilykos
    application using the /healthz contract.
  - Use one 20-minute deadline from Linux userspace startup, including image import and required startup database
    checks/migrations. Do not add a second deadline after application startup.
  - On timeout or a hang, automatic reboot/reset MUST advance the three-attempt candidate policy and select the
    previous known-good slot; watchdog coverage MUST be demonstrated.
  - Internet, network link, Bluetooth and inverter availability MUST NOT gate confirmation. Periodic expensive integrity
    diagnostics remain separate from health.
  - Recovery availability MUST NOT mark the ordinary application slot healthy. Shared DATA failure and both exhausted
    slots MUST route to their approved recovery states instead of endless retries.
  implementation_status:
  - Current mark-good script waits up to 1200 seconds after epilykos.service, leaves failure unconfirmed and does
    not reboot. The whole-userspace deadline, autonomous reset/watchdog and recovery routing remain pending.
  evidence:
  - systemd dependency graph
  - epilykos-health-gate.service test
  - Test with Ethernet unplugged and Wi-Fi unconfigured still marks slot good
  - Test with intentionally broken Epilykos startup does not mark slot good
- id: C-DATA-001
  title: Persistent DATA paths
  stage: 0
  status: draft
  requirements:
  - DATA MUST be the only authoritative persistent writable partition for application state.
  - Epilykos application data MUST reside below /data/epilykos/.
  - The current Epilykos database path ./data/energy.db MUST map to persistent DATA inside the container.
  - Recommended host layout is /data/epilykos/app-data, /data/epilykos/snapshots, /data/epilykos/journal, /data/containers,
    and /data/epilykos/update-state.
  - OS rollback MUST NOT revert database, settings, or snapshots.
  evidence:
  - Mount table
  - Container volume inspection
  - Create data on ROOT-A, boot ROOT-B, verify identical data
- id: C-DATA-002
  title: Container storage paths
  stage: 2
  status: draft
  requirements:
  - Podman persistent graph storage MUST be under /data/containers.
  - Ephemeral Podman runtime state MUST remain under /run and MAY be lost on reboot.
  - OCI image storage MUST survive OS A/B slot switches.
  - The appliance MUST NOT need to pull an OCI image during normal boot.
  evidence:
  - podman info --format json
  - Boot ROOT-A then ROOT-B with network disconnected and verify containers start
- id: C-DATA-003
  title: SQLite durability configuration
  stage: 4
  status: draft
  requirements:
  - SQLite MUST remain in WAL mode unless a measured power-loss test justifies a different mode.
  - The SQLite synchronous mode MUST be explicitly selected and recorded; architecture v0.5 does not freeze the
    value.
  - Filesystem and mount options MUST NOT disable normal ext4 write barriers or otherwise trade durability for benchmark
    speed.
  - Clean shutdown SHOULD checkpoint WAL, but correctness MUST NOT depend on clean shutdown.
  - Power-cut testing MUST use the actual v1 storage medium and include repeated abrupt loss during active writes.
  - Periodic integrity diagnostics MUST be separate from boot-health gating.
  - The Quadlet MUST set SQLITE_SYNCHRONOUS explicitly to the value frozen by D-SQLITE-001; the application refuses
    OFF and reports the effective journal and synchronous mode in /healthz.
  - Telemetry samples are buffered for at most METRIC_FLUSH_INTERVAL_MS (5 s) before commit. The power-cut acceptance
    criterion MUST define acceptable telemetry loss as no more than this window plus the synchronous-mode window;
    configuration and settings writes are never buffered and MUST survive.
  - Power-cut testing MUST run on the Tier 1 board with the recommended microSD card class. Documentation MUST recommend
    a high-endurance card and state the expected write volume per day so wear can be estimated.
  - The appliance sets SQLITE_SYNCHRONOUS=FULL (D-SQLITE-001). PRAGMA quick_check MUST run after every unclean shutdown
    and weekly; its result is reported in the dashboard and diagnostics, never used as a boot-health condition.
  - Maintenance MUST use C-STORAGE-001 operation-specific peak-allocation checks; existing retained snapshots are
    already counted in used space and MUST NOT be double-counted as additional free-space demand.
  evidence:
  - PRAGMA journal_mode
  - PRAGMA synchronous
  - mount output
  - Power-cut test report
  - Snapshot restore test
  implementation_status:
  - SQLITE_SYNCHRONOUS (NORMAL default = previous implicit value; FULL/EXTRA allowed; OFF refused) and METRIC_FLUSH_INTERVAL_MS
    exported — app commit fabfa89.
- id: C-RUNTIME-001
  title: Podman host contract
  stage: 2
  status: draft
  requirements:
  - Podman runs rootful for v1 (D-RUNTIME-001); the application inside the Epilykos container MUST run as uid/gid
    1000, not as root.
  - The host MUST use cgroup v2, crun, and netavark or host networking.
  - The Epilykos service MUST start at boot without an interactive login.
  - Required OCI images MUST be preloaded before first normal boot.
  - Image pull behavior MUST be explicit and MUST NOT make boot network-dependent.
  implementation_status:
  - The image uses the approved rootful Podman service with crun/cgroup v2 and DATA-backed storage; the application
    runs as uid/gid 1000. Rootless/subuid work is outside v1.
  - The build preloads the pinned arm64 OCI archive and starts it without a registry dependency. Full hardware acceptance
    remains outstanding.
  evidence:
  - podman inspect epilykos (User 1000:1000)
  - podman info
  - Offline boot test
- id: C-RUNTIME-002
  title: Epilykos container service
  stage: 2
  status: draft
  requirements:
  - The production container service (Quadlet or equivalent systemd launcher) MUST reference an immutable image
    digest supplied by the active application manifest.
  - The host uses approved rootful Podman; the application MUST run as uid/gid 1000 inside a non-privileged container.
  - Persistent /app/data MUST map to DATA.
  - Application logs in appliance mode MUST go to stdout/stderr; the existing Winston file transport MUST be disabled
    or not configured.
  - Podman health MUST use a dedicated unauthenticated local health endpoint containing no secrets.
  - Notify=healthy (or equivalent Quadlet readiness behavior) MUST gate systemd readiness.
  - The Podman HealthCmd MUST call GET /healthz, which returns 200 only when the app serves HTTP and SQLite opens
    with the expected schema, and 503 otherwise; it MUST NOT depend on network, Internet, BLE or inverter availability.
  - The health start period MUST allow first-boot migrations on a large database (SHOULD be at least 60 s; exact
    value frozen with C-BOOT-003 timeout).
  - The container service MUST set LOG_TO_FILE=false so the application never creates or writes a log directory.
  - All persistent application state lives under /app/data (energy.db with -wal/-shm, snapshots/, session-secret,
    settings-password), which MUST be the single DATA bind mount.
  - The appliance container root filesystem MUST be read-only in v1 after validating required write paths. Persistent
    state belongs on DATA and temporary writes on explicitly bounded scratch mounts; no silent read-write fallback
    is permitted.
  - Small temporary work MAY use bounded RAM-backed /tmp. Production-size backup/restore/update uploads MUST stream
    to private DATA staging with storage admission and expansion limits.
  - Host-controlled BOOT-file password reset, DATA password/session updates, large restore and verified image replacement
    MUST remain supported and be tested with the read-only container.
  evidence:
  - Rendered systemd unit from Quadlet
  - podman inspect
  - Health endpoint test
  - Filesystem write test
  implementation_status:
  - The image uses an equivalent tested systemd launcher because the bundled Podman does not ship the Quadlet generator.
    Host root is read-only; container root enforcement and the large-upload write-path changes remain pending.
- id: C-RUNTIME-003
  title: Bluetooth access for the Epilykos container
  stage: 3
  status: blocked-on-spike
  requirements:
  - Bluetooth (BMS and inverter BLE modules) MUST be served by the Epilykos container talking to host BlueZ over
    the system D-Bus; no separate Bluetooth container and no BlueZ inside the container.
  - privileged=true MUST NOT appear in the production appliance configuration without an approved exception.
  - Capability/device access MUST be determined by the ordered Stage 3 spike, not guessed in advance.
  - The final D-Bus policy and device/capability set MUST be committed as code and regression-tested.
  - The v1 spike MUST verify approved rootful Podman with the application as uid 1000, host BlueZ/D-Bus and no privileged
    mode or additional capabilities. Rootless experimentation is not a v1 prerequisite.
  implementation_status:
  - 'Tier 1 image: the onboard BCM43438 comes up through the mainline device tree''s serdev node on the PL011 (hci_uart
    + hci_bcm, BCM43430A1.hcd from brcmfmac_sdio-firmware-rpi); bluetoothd is enabled; the container gets /run/dbus
    read-only and no capabilities. BlueZ 5.79''s default D-Bus policy already lets non-root callers reach org.bluez.'
  - 'UART speed: the mainline bcm2837-rpi-3-b device tree runs the BCM43438 at 2000000 baud with no hardware flow
    control; on the board that overran the PL011 (oe in /proc/tty/driver/ttyAMA, "Frame reassembly failed (-84)", HCI
    command timeouts) and left BlueZ refusing every connect and scan with org.bluez.Error.InProgress. A kernel patch
    adds hci_uart.max_speed and /etc/modprobe.d/epilykos-bluetooth.conf sets 921600, in the root filesystem so OS
    updates carry it (the device tree on BOOT is not updated).'
  - 'Recovery: hostd bluetooth_recover (reasons in_progress, no_adapter) restarts bluetoothd, at most once per 10
    minutes (/run/epilykos/bluetooth-recover); the application asks for it when every Bluetooth device is refused with
    InProgress, or no adapter is found, for two minutes. Restarting bluetoothd cleared the stuck state on the board.'
  - The appliance container uses host networking (unlike the Track 1 bridge baseline) so the app is served on port
    3000 of the box (or the port chosen in settings, C-HOST-001) and Tuya LAN discovery works; Bluetooth access
    is unchanged by it. Hardware confirmation is still the Stage 3 spike.
  evidence:
  - Stage 3 BLE hardware test report
  - Static Quadlet scan
  - D-Bus policy file
  baseline:
  - Track 1 now runs Bluetooth inside the epilykos container (application dev branch; the bms-bridge sidecar is
    retired). The container runs as uid 1000 on a bridge network with only /run/dbus bind-mounted read-only; bleak
    talks to host BlueZ over D-Bus. No host networking, no privileged mode, no BlueZ in the image.
  - That is already the first step of the test order above; the Stage 3 spike confirms it on the Tier 1 board under
    the approved rootful Podman launcher and host D-Bus policy and records the D-Bus policy it needs.
  - The OS image ships host BlueZ (bluez5_utils); bringing up the Pi 3B onboard radio (firmware, UART attach) is
    part of the spike.
  - On the Tier 1 Pi 3B the onboard Bluetooth uses the PL011 UART; serial inverters and BMS on that board SHOULD
    use USB serial adapters so BLE and serial do not compete for the UART.
- id: C-RESOURCE-001
  title: Memory and storage budget on Tier 1
  stage: 2
  status: draft
  requirements:
  - The complete appliance (host services including BlueZ, Podman, Epilykos with its Bluetooth helper, journald) MUST run
    steady-state on the 1 GB Tier 1 board with the free-memory headroom frozen by D-RESOURCE-001.
  - The Epilykos container MUST cap the Node.js heap (NODE_OPTIONS=--max-old-space-size) and set a container memory limit,
    so a leak restarts the application instead of starving the host.
  - Swap, if used, MUST be compressed RAM (zram); swap on the SD card MUST NOT be configured.
  - OOM handling MUST protect journald, Podman and the health gate; the Epilykos container MUST be the preferred OOM victim
    and MUST restart automatically.
  - Storage growth (database, snapshots, journal) MUST be bounded or monitored so DATA cannot silently fill on the Tier 1
    medium.
  - 'Frozen budget (D-RESOURCE-001): container memory limit 640 MB, Node.js heap cap 384 MB, zram swap 256 MB (zstd), at least
    100 MB free memory steady-state on Tier 1.'
  evidence:
  - '72-hour soak on Tier 1 with active polling: memory, swap and OOM-event timeline'
  - podman inspect showing memory limits and NODE_OPTIONS
  - Forced-leak test showing the container restarts and the host stays healthy
- id: C-RELEASE-001
  title: Release channels and image provenance
  stage: 2
  status: draft
  requirements:
  - Both repositories use dev as the integration branch and main for stable releases only; only the maintainer merges
    dev into main (D-RELEASE-001).
  - Every application image build MUST publish a digest record {service, image, digest, tag, commit, ref}; the record,
    not the tag, is the input to manifests.
  - 'Stable application manifests (channel: stable) MUST reference only digests whose record has ref main (I-009).'
  - Stable OS images and RAUC bundles MUST be built from the epilykos-os main branch, and their preloaded OCI images
    MUST come from a stable application manifest.
  - 'Appliance images MUST accept only channel: stable manifests; developer images MAY accept channel: dev.'
  - Stable releases SHOULD carry a vX.Y.Z git tag in the originating repository. The tag and release string are
    descriptive; the manifest sequence remains the only ordering primitive (C-UPDATE-002).
  - Mutable tags (latest, dev) MAY be used to discover a build but MUST be resolved to a recorded digest before
    any manifest or image preload references it.
  - 'Merging dev into main in the application repository is the release: CI MUST then tag vX.Y.Z, publish the digest
    records, update and merge the stable application manifest in epilykos-os, and build the stable OS image, with
    no further manual step. A failing check at any step stops the release there.'
  - 'Stable OS images are published as GitHub Releases of epilykos-os: the SD card image (.zst) and a Raspberry
    Pi Imager OS list (the newest release''s list is at releases/latest/download/epilykos-os-imager.json). Test
    builds from dev and other branches are CI artifacts only, kept 14 days.'
  - After the existing maintainer merge authorization, reliable automated build, artifact, configuration, signature
    and provenance checks MUST govern automatic publication. No additional routine per-image manual approval is
    permitted.
  - The current QEMU Pi boot checks MUST remain explicitly diagnostic until calibrated against known-good and deliberately
    broken images. Emulator limitations MUST NOT be represented as real-board failures or hardware evidence.
  - Initial Pi 3B platform/recovery acceptance and a 72-hour production-size soak are required; repeat targeted
    hardware tests for relevant boot/storage/recovery changes rather than manually approving every ordinary image.
  - Missing artifacts, failed required checks and invalid provenance MUST block publication across dispatch/push/release/app-bridge/retry
    paths. Publish verified build artifacts rather than an untested rebuild.
  evidence:
  - Digest-record artifacts from the application build workflows (main and dev)
  - Manifest provenance check output for each stable release
  - Image-build log showing preloaded digests
  implementation_status:
  - 'Application repo: build workflows record the pushed multi-arch digest, commit and ref as an artifact and step
    summary (app commit fabfa89).'
  - 'OS repo: make contracts enforces provenance for every manifest in manifests/ against release/digest-records/.'
  - 'Bridge: after each image build the application repository sends an app-image-published repository_dispatch
    carrying the digest records; .github/workflows/app-release-sync.yml applies them with tools/sync_app_release.py
    (strict payload validation), authenticates the source branch and successful build artifact, runs make contracts,
    then merges a manifest-only PR into dev or main respectively. The maintainer''s source merge is the release
    decision (D-RELEASE-001); signing and stable image build are explicitly dispatched after the token-authored
    merge.'
  - The full OS build workflow is on dev but not main at the reviewed baseline. Publication gates and current QEMU
    result handling still need alignment with this policy.
- id: C-UPDATE-001
  title: OS update trust model
  stage: 5
  status: draft
  requirements:
  - Every RAUC bundle MUST be signed.
  - Development RAUC CA and Epilykos release RAUC CA MUST be separate trust anchors.
  - Secure-boot keys MUST be a separate hierarchy from RAUC bundle-signing keys.
  - Appliance images MUST trust the release RAUC CA; developer images MAY additionally trust a development CA according
    to documented policy.
  - The private release signing key MUST NOT be embedded in images or repositories.
  - Invalid signatures, unsigned bundles and untrusted signers MUST be rejected before writing an update slot. Corrupt streamed payload content MUST prevent successful activation.
  - RAUC public trust anchors MUST be embedded in each OS slot. Production images trust only the release CA; developer
    trust policy MUST be explicit, with no dashboard verification bypass.
  - Keep CA private keys offline with a protected recoverable backup and a separate protected CI release signer.
    App-manifest, RAUC and future secure-boot keys MUST remain separate.
  - Online, upload and USB installation MUST apply identical authenticity and board checks. Test offline certificate-time
    handling, validity/rotation and recovery trust without silently disabling validation.
  evidence:
  - Valid signed-bundle install
  - Invalid-signature rejection test
  - Wrong-CA rejection test
  - Repository secret scan
  implementation_status:
  - No RAUC keyring, signed OS bundle publication or OS install API is implemented yet; installation is intentionally
    refused. Signing/trust policy is approved, not proven.
- id: C-UPDATE-002
  title: Application update manifest
  stage: 5
  status: draft
  requirements:
  - Application manifests MUST pin immutable OCI digests; tags such as latest and dev MUST NOT be accepted by the appliance
    updater.
  - Manifest MUST identify each application image independently. epilykos is required; bms-bridge is a legacy optional
    entry for application releases that still ship the Bluetooth sidecar.
  - Updater state MUST distinguish current, candidate, and previous-known-good manifests.
  - A candidate MUST be downloaded/verified before activation.
  - Promotion MUST occur only after the candidate reaches application-health success.
  - Failure MUST restore the previous-known-good manifest without changing the RAUC OS slot.
  - The manifest MUST contain a monotonically increasing integer sequence used by C-UPDATE-004 for replay/downgrade protection.
  - The human-readable release field is descriptive and MUST NOT be used as the anti-replay ordering primitive.
  - The manifest MUST declare its channel (stable or dev); channel is covered by the same trust decision as the digests and
    sequence (C-UPDATE-004).
  evidence:
  - Schema validation test
  - Reject-tag test
  - Candidate failure rollback test
  - OS slot unchanged assertion
  - Reject dev-channel manifest on an appliance image
  manifest_schema:
    schema: 1
    release: string
    channel: stable | dev
    images:
      epilykos:
        digest: sha256:<64 hex>
        source: string
      bms-bridge: optional, legacy releases only — {digest, source}
    sequence: integer >= 1, monotonically increasing across promoted releases
  implementation_status:
  - 'epilykos_update (used by epilykos-hostd): pulls the signed candidate by digest, starts it through active.env on DATA,
    promotes it only when epilykos.service reports healthy (current/previous/floor on /data/epilykos/updater), otherwise
    restores the previous image; the boot slot is never touched. An update cut short is rolled back at the next hostd start.
    epilykos-run starts active.env only when its sequence is at least the slot''s preloaded one. tools/test_app_update.py.'
- id: C-UPDATE-003
  title: Independent rollback behavior
  stage: 5
  status: draft
  requirements:
  - OS update failure MUST roll back via U-Boot/RAUC without reverting DATA.
  - Application update failure MUST roll back OCI manifests without changing the boot slot.
  - A successful application update followed by an OS rollback MUST retain the active application manifest unless an explicit
    compatibility rule says otherwise.
  - Compatibility metadata MAY later constrain OS/application combinations, but no hidden coupling is permitted.
  evidence:
  - 'Four-way matrix test: OS success/fail x application success/fail'
  - DATA persistence assertion after each case
- id: C-UPDATE-004
  title: Application manifest delivery and trust
  stage: 5
  status: draft
  requirements:
  - The appliance MUST NOT accept an application candidate merely because its OCI images are digest-pinned; the
    manifest authorizing those digests MUST itself arrive through an authenticated or explicitly user-approved trust
    path.
  - 'Supported delivery paths MUST mirror the local-first OS-update model: USB/removable media, authenticated local
    upload/push, and official online releases; custom update-server URLs are deferred from v1.'
  - Transport security alone MUST NOT be treated as equivalent to release authorization unless the contract explicitly
    freezes that model and its pinning/approval semantics.
  - An untrusted, unsigned, incorrectly signed, substituted, or otherwise unauthorized manifest MUST be rejected
    before any candidate OCI image is activated.
  - Manifest verification MUST occur before C-UPDATE-002 candidate promotion logic begins.
  - Every externally supplied application manifest MUST carry a monotonically increasing integer release sequence
    in addition to the human-readable release/version string.
  - The manifest trust decision MUST cover the release sequence together with the image digests; the sequence MUST
    NOT be accepted from unsigned/unapproved metadata beside an otherwise trusted manifest.
  - The appliance MUST persist the highest promoted release sequence on DATA and MUST reject externally supplied
    manifests whose sequence is less than or equal to that floor as stale/replayed, with no external application
    downgrade override in v1.
  - Automatic rollback to the internally retained previous-known-good manifest is not treated as accepting an old
    external manifest and MUST remain possible without lowering the stored release-sequence floor.
  - A failed candidate that is never promoted MUST NOT advance the stored highest promoted release sequence.
  - 'Frozen model (D-UPDATE-001): Ed25519-signed manifests verified against a public key pinned in the OS image,
    with a key separate from the RAUC release CA. Delivery paths: online check against the GitHub release, dashboard
    upload, USB stick.'
  - Application manifests MUST use the existing Ed25519-signed model with a pinned key separate from the RAUC CA.
    Complete offline packages MUST satisfy C-UPDATE-006; a signed manifest alone is not a self-contained update.
  evidence:
  - USB manifest delivery test
  - Authenticated local upload/push test
  - Tampered/substituted manifest rejection test
  - Wrong-signer or untrusted-source rejection test
  - Audit record showing source, trust result, release identifier, and selected digests without leaking secrets
  - 'Valid old-manifest replay test: previously trusted manifest with sequence <= stored floor is rejected before
    OCI activation'
  - Failed-candidate test confirming an unpromoted higher sequence does not advance the stored release floor
  - Internal previous-known-good rollback test confirming rollback remains possible without lowering the stored
    release floor
- id: C-NET-001
  title: Offline-boot invariant
  stage: 2
  status: draft
  requirements:
  - Boot MUST reach healthy Epilykos application state with Ethernet unplugged, Wi-Fi unconfigured, DNS unavailable, and Internet
    unavailable.
  - No service required for local inverter/BMS monitoring may have a hard dependency on network-online.target.
  - Loss of network after boot MUST NOT stop local polling or corrupt persisted data.
  evidence:
  - Network-isolated cold boot
  - systemd critical-chain inspection
  - Network pull/reconnect test
- id: C-PROV-001
  title: Ethernet provisioning
  stage: 1
  status: draft
  requirements:
  - On first boot with DHCP Ethernet, the appliance MUST become discoverable by mDNS as epilykos.local.
  - Provisioning MUST NOT require SSH or a terminal.
  - Provisioning MUST work without vendor cloud connectivity.
  implementation_status:
  - 'Tier 1 image: systemd-networkd DHCP on wired Ethernet and Wi-Fi, systemd-resolved answers mDNS for epilykos.local on
    both; the dashboard is at http://epilykos.local:3000. No SSH or terminal is involved.'
  evidence:
  - Clean-flash Ethernet-only test from a separate client
- id: C-PROV-002
  title: Wi-Fi provisioning without a network
  stage: 1
  status: draft
  requirements:
  - If no usable network is configured, Wi-Fi setup over Bluetooth LE (the open Improv Wi-Fi protocol) MUST be available,
    together with the wifi.txt / Raspberry Pi Imager files on BOOT.
  - After initial provisioning, Wi-Fi setup MUST reopen only through an authenticated "Change Wi-Fi" action in Epilykos
    settings (for 15 minutes) or automatically after 2 minutes without a network address (D-PROV-001).
  - Provisioning credentials and secrets MUST not be written to logs or diagnostics bundles.
  implementation_status:
  - 'Wi-Fi without a terminal, three ways: (1) wifi.txt on the BOOT partition (template wifi-example.txt ships there);
    (2) Raspberry Pi Imager settings, via an OS list (tools/imager_os_list.py) declaring init_format systemd, imported
    from firstrun.sh / network-config / rpi-preseed.toml without running them; (3) Bluetooth LE using the open Improv
    Wi-Fi protocol (epilykos-improv), usable from a Web Bluetooth browser or Home Assistant.'
  - 'Secrets: imported BOOT files are deleted after import; credentials are stored only in iwd network files (0600)
    on DATA; no setup path logs a password (covered by tools/test_wifi_provisioning.py and tools/test_improv_dbus.py).'
  - Improv BLE replaces the old captive-portal proposal. Authenticated Change Wi-Fi opens a bounded window; automatic
    no-address reopening follows D-PROV-001 and is covered by host/Improv tests.
  - BlueZ remains LE-only. Improv setup itself needs no pairing; the host now provides a separate bounded pairing
    agent/window for BMS/inverter devices, including PIN/passkey confirmation and persistent bonds.
  evidence:
  - Clean-flash Wi-Fi-only provisioning test (file on BOOT, and over Bluetooth)
  - 'Re-entry test: dashboard action, and network loss'
  - Secret-redaction test
- id: C-PROV-003
  title: USB Ethernet gadget provisioning
  stage: 1
  status: deferred-v1
  requirements:
  - 'USB Ethernet gadget provisioning is a Tier 2 capability only: the Pi 3B USB ports are host-only, so it MUST NOT be required
    by any stage gate (C-HW-001).'
  - Where the board supports it (Pi 4, Pi 5 USB-C), gadget provisioning SHOULD use the upstream project's proven configuration
    and MUST NOT prevent Ethernet or Wi-Fi provisioning if it fails.
  - Documentation MUST warn that a host USB port may not supply sufficient power for a Pi 4 or Pi 5.
  evidence:
  - Community Tier 2 test report (best effort)
  unresolved:
  - Minimum supported host OS matrix
- id: C-RECOVERY-001
  title: Slot exhaustion behavior
  stage: 5
  status: draft
  requirements:
  - When both ROOT slots are unusable or exhaust their bounded attempts, the bootloader MUST automatically enter
    a minimal independent recovery environment instead of resetting attempt counters indefinitely.
  - Recovery MUST boot without either normal rootfs, DATA or Podman. Provide authenticated diagnostics and signed,
    board-compatible OS repair through local upload and USB with no mandatory Internet.
  - Entry is automatic; repair/reinstallation requires explicit authorization. Preserve DATA, reject invalid packages
    and retain the recovery path across power loss.
  - The recovery payload location, protected bootstrap boundary and DATA-independent per-device credential lifecycle
    MUST be designed and proven on Pi 3B; no extra partition or silent migration is assumed.
  - A Linux recovery target does not replace automatic early boot-chain recovery, and cannot promise recovery from
    physical loss of the entire card.
  evidence:
  - Both-slots-bad real Pi 3B automatic recovery-entry test
  - Authenticated offline signed repair, DATA preservation and interrupted-repair recovery evidence
  implementation_status:
  - Current boot.cmd resets both counters after exhaustion. The independent recovery image, authorization and repair
    paths are required in v1 but are not implemented.
- id: C-ACCESS-001
  title: SSH maintenance access
  stage: 4
  status: draft
  requirements:
  - SSH MUST be disabled by default in the appliance image; provisioning MUST NOT require SSH.
  - SSH is enabled by an authenticated administrator action in Epilykos settings, or at first boot by Raspberry Pi Imager's
    SSH settings or an authorized_keys file on BOOT (D-ACCESS-001).
  - 'Login is the non-root user epilykos (with sudo). Password authentication and public-key authentication are both supported:
    the password is set in the dashboard or by Imager; public keys are added in the dashboard, by Imager or from BOOT. The
    appliance does not generate keypairs.'
  - Root login MUST remain disabled. With no password and no key configured, SSH MUST NOT accept any login.
  - Password hashes and authorized keys live on DATA; turning SSH off stops the server and keeps them; the dashboard can remove
    each key and clear the password.
  - Credentials MUST NOT appear in logs, diagnostics bundles, telemetry, or application manifests.
  evidence:
  - Fresh appliance image test showing SSH unavailable by default
  - Settings workflow test enabling SSH, setting a password and adding a key
  - Password and key login as epilykos; root login rejected
  - Disable/re-enable lifecycle test
  - Secret-redaction test
- id: C-TIME-001
  title: Clock and synchronization
  stage: 1
  status: draft
  requirements:
  - Boards without a real-time clock (Tier 1 Pi 3B, Pi 4) MUST persist the last known time on DATA and restore it early in
    boot, so the clock never starts before the last shutdown; the Pi 5 onboard RTC and optional I2C RTC modules MUST be used
    when present.
  - Until network time synchronisation succeeds, the clock MUST be reported as unsynchronised to the application and dashboard.
  - The selected NTP client MUST be explicitly included and configured; it may not be assumed from distro defaults.
  - Loss of Internet MUST NOT block boot.
  - The dashboard MUST expose unsynchronized-clock state and provide a manual correction path.
  - Provisioning MUST capture the site time zone and pass it to the container as TZ (or a matching /etc/localtime); daily
    totals, savings and forecasts use this zone.
  - Stored timestamps are UTC epoch seconds; correcting the clock MUST NOT rewrite stored history.
  - The host MUST expose clock-synchronization state to the application in a documented, read-only form so the dashboard can
    show it.
  - 'Frozen implementation (D-TIME-001): systemd-timesyncd, NTP servers from DHCP then pool.ntp.org; sync state reaches the
    container as a read-only file.'
  evidence:
  - Cold boot without network
  - NTP recovery test
  - 'Tier 1 cold boot without network: clock is not earlier than the last shutdown and is flagged unsynchronised'
  - RTC retention test on a board or module with a backup battery (best effort)
  implementation_status:
  - Application follows TZ, else /etc/localtime; /healthz reports time and time zone.
  - 'Host writes /run/epilykos/clock.json every 15 seconds, mounted read-only into the container; the dashboard warns when unsynchronized or stale. Site time zone persists on DATA and is passed as TZ.'
- id: C-LOG-001
  title: Logging and diagnostics
  stage: 4
  status: draft
  requirements:
  - Appliance-mode container logs MUST use stdout/stderr and be collected by journald.
  - Persistent journal storage MUST live on DATA with a hard size cap.
  - Diagnostics export MUST include journal, container status, RAUC status, boot-slot metadata, kernel version,
    hardware enumeration, redacted network state, application version/digests, and database status.
  - Diagnostics export MUST redact credentials, tokens, private keys, Wi-Fi PSKs, and application secrets.
  - The persistent journal cap is 64 MB (D-LOG-001).
  - Provide authenticated local Download diagnostics in normal and DATA-independent recovery UI. Never transmit
    automatically to a third party.
  - Collectors MUST have bounded time/output, return partial results with explicit omissions and exclude raw database/backups
    and unrestricted environment/configuration dumps.
  - Redact structured fields and logs, including token-bearing URLs, Wi-Fi secrets, pairing PINs/bonds and session
    secrets. Export existing DB check outcomes without starting an expensive full scan.
  evidence:
  - Journal persistence across A/B switch
  - Storage-cap test
  - Diagnostics bundle content test
  - Secret-redaction test
  implementation_status:
  - 'Application: LOG_TO_FILE=false gives stdout/stderr only; ANSI colours only on a TTY; per-request HTTP logs
    are below the default level — app commit fabfa89.'
  - Persistent journal cap and app logs exist; bounded redacted host/recovery export remains pending.
- id: C-HOST-001
  title: Dashboard system actions
  stage: 2
  status: draft
  requirements:
  - Epilykos settings MUST offer Restart and Shut down for the whole appliance, available to an authenticated administrator
    only and confirmed before they run.
  - A restart or shutdown MUST stop the Epilykos container cleanly first (SQLite WAL checkpoint) and then the host.
  - Settings MUST also offer "Change Wi-Fi" (C-PROV-002) and the SSH controls (C-ACCESS-001).
  - The container MUST reach these host actions through one narrow host interface that accepts only these named actions;
    it MUST NOT gain general root access to the host.
  - 'The application''s first-run setup MUST NOT depend on a code printed to a log: the first visitor sets the administrator
    password.'
  - Settings MUST also check for and install application updates through the same interface (update_status, update_check,
    update_apply), under C-UPDATE-002 and C-UPDATE-004; the container never chooses or supplies an image digest.
  - Settings MUST let the administrator change the dashboard's port (set_port), 80 or 1024-65535 and free on the box; the
    port is kept on DATA, the default is 3000, and the host restarts the container on the new port.
  - 'A forgotten dashboard password MUST be replaceable with physical access only, never over the network:
    dashboard-password.txt on BOOT (read once before the app starts, then deleted) or epilykos-reset-password on the console.'
  - 'A factory reset MUST erase everything on DATA and nothing else, asked for with the word ERASE from settings
    (factory_reset), the console (epilykos-factory-reset) or factory-reset.txt on BOOT; it is carried out before DATA is
    mounted on the next boot, and the request is deleted only after DATA has been rewritten and never carried out twice.'
  evidence:
  - 'Restart and shutdown from the dashboard: clean journal shutdown, no fsck repair on the next boot'
  - Unauthenticated request rejected
  - Container cannot invoke any other host action through the interface
- id: C-SECUREBOOT-001
  title: Optional verified-boot chain
  stage: 6
  status: deferred-v1
  requirements:
  - Hardware-anchored secure/verified boot and cryptographic rootfs integrity enforcement (for example dm-verity)
    remain deferred from v1.
  - Signed update packages, read-only operation and automatic boot-chain recovery remain required. Read-only mounts
    do not provide cryptographic integrity or protection against direct card modification.
  - No v1 documentation may claim full secure boot or infer later-board hardware trust capabilities on Pi 3B. Any
    later implementation requires board-specific trust, rotation, anti-rollback and recovery design with tamper
    negative tests.
  evidence:
  - Verified-boot negative test with tampered kernel/DTB/initramfs
- id: C-BOOT-004
  title: Dedicated early boot-chain updater
  stage: 5
  status: draft
  requirements:
  - v1 MUST include a dedicated authenticated updater for the approved Raspberry Pi early firmware/U-Boot/shared
    boot configuration domain, separate from ordinary per-slot Linux updates.
  - Recover automatically from interrupted writes/activation/confirmation and corrupt, valid-but-nonbooting or hanging
    candidate loaders without manual power cycling, SD removal or another computer.
  - An earlier protected component MUST select/reset to known-good boot artifacts; atomic writes alone are not bad-code
    recovery. Define the earliest protected boundary and compatibility with both Linux slots and independent recovery.
  - Power-cut and bad-loader tests on real Pi 3B MUST demonstrate the mechanism before it is claimed usable. If
    a required component cannot safely update under the selected boundary, report the measured limitation without
    silently relaxing recovery.
  implementation_status:
  - Approved v1 requirement; implementation and acceptance evidence remain pending.
  evidence:
  - Automated positive/negative tests and identified Pi 3B hardware cases; missing evidence is pending, not a pass.
- id: C-STORAGE-001
  title: Free-space warnings and maintenance admission
  stage: 4
  status: draft
  requirements:
  - Warn below max(20% of DATA capacity, 2 GiB); optional maintenance MUST leave max(10% of DATA capacity, 1 GiB)
    remaining at projected peak use.
  - Use actual space available to the service and account for additional upload/decompression/scratch/WAL/migration/OCI/rollback
    allocations. Do not assume compression saves space or count existing snapshots twice.
  - Enforce concurrency budgets, upload/expansion limits and transition rechecks; handle ENOSPC safely. Keep normal-growth
    monitoring because admission headroom is not a hard reservation against future telemetry writes.
  - Refuse with required/available space rather than deleting live data, retained snapshots or active/known-good
    images. Clean only identified orphaned files no longer owned or needed for crash recovery.
  - Keep 32 GB minimum and 64 GB recommended; never promise all production-size operations fit on 32 GB. Recovery
    controls must remain usable in a low-space state.
  implementation_status:
  - Approved v1 requirement; implementation and acceptance evidence remain pending.
  evidence:
  - Automated positive/negative tests and identified Pi 3B hardware cases; missing evidence is pending, not a pass.
- id: C-DATA-004
  title: Production-size backup and recoverable restore
  stage: 4
  status: draft
  requirements:
  - Backup/download and restore/upload MUST support multi-gigabyte databases including the approximately 5.9 GB
    production case with bounded memory and private DATA staging, not the 50 MiB/RAM temporary path.
  - Create consistent SQLite backups accounting for WAL; validate integrity, required schema and migration compatibility
    before replacement. Long work MUST NOT block the dashboard event loop.
  - Serialize conflicting maintenance, quiesce all DB users for replacement and use durable restore state with coherent
    WAL/SHM handling. Keep the original until restored migrations/checks and app health succeed.
  - After an interrupted upload, process death or power cut, recover to a complete validated database or retained
    original, never a partial copy or unrelated sidecars. Show progress and warn before monitoring pauses.
  implementation_status:
  - Approved v1 requirement; implementation and acceptance evidence remain pending.
  evidence:
  - Automated positive/negative tests and identified Pi 3B hardware cases; missing evidence is pending, not a pass.
- id: C-DATA-005
  title: Compressed daily snapshots
  stage: 4
  status: draft
  requirements:
  - Create one due daily snapshot and retain the two newest successfully completed snapshots using bounded background
    streaming gzip. Preserve legacy plain DB backup/restore support.
  - Publish a verified durable replacement before pruning; failed/incomplete files MUST NOT consume retention slots
    or remove the last known-good snapshots.
  - After downtime, coalesce missed days into one job after health/maintenance availability. Bound concurrent work
    and retries, handle clock steps and warn on overdue/failed/space-skipped snapshots.
  - Apply decompression/peak-space limits and never delete retained snapshots to make temporary space. Same-card
    snapshots do not replace external backup reminders.
  implementation_status:
  - Approved v1 requirement; implementation and acceptance evidence remain pending.
  evidence:
  - Automated positive/negative tests and identified Pi 3B hardware cases; missing evidence is pending, not a pass.
- id: C-UPDATE-005
  title: OS delivery and manual install controls
  stage: 5
  status: draft
  requirements:
  - Support official online delivery, authenticated local upload and USB import with identical verification and
    storage checks. Custom URLs are outside v1.
  - 'OS installation is manual in v1: show the release, preflight and expected monitoring outage before authenticated
    Install and reboot. Optional automatic checks do not authorize installation.'
  - Install into an inactive slot, shut down/reboot cleanly, and report confirmation/rollback after reconnect. USB
    insertion or a disconnected browser MUST NOT trigger or duplicate unauthorized activation.
  - Serialize conflicting app/OS update and restore actions; preserve active slot, DATA and known-good assets. Signed
    package, board/boot-chain compatibility and complete candidate verification are required.
  implementation_status:
  - Approved v1 requirement; implementation and acceptance evidence remain pending.
  evidence:
  - Automated positive/negative tests and identified Pi 3B hardware cases; missing evidence is pending, not a pass.
- id: C-UPDATE-006
  title: Complete offline application packages
  stage: 5
  status: draft
  requirements:
  - Release platform-specific offline packages containing signed release authorization and all required OCI content
    so installation needs no registry/DNS/Internet access.
  - Bind archive hashes/sizes and platform image graph to signed authorization, correctly relating multiarch index
    and included manifest/config/layers. A tag or successful podman load alone is insufficient proof.
  - Support authenticated upload and USB import followed by explicit installation approval, bounded staging and
    safe archive parsing; do not run package hooks.
  - Apply the same signer/channel/sequence policy and app health/known-good rollback as online installation, without
    OS slot switching or normal host reboot. Preserve replay state and verify DB compatibility through image rollback.
  implementation_status:
  - Approved v1 requirement; implementation and acceptance evidence remain pending.
  evidence:
  - Automated positive/negative tests and identified Pi 3B hardware cases; missing evidence is pending, not a pass.
acceptance_tests:
- id: T-BOOT-001
  stage: 4
  assertion: Pi 3B developer/appliance images retain the approved MBR topology; each selected Linux slot supplies
    its matching kernel, DTB, modules and rootfs.
- id: T-BOOT-002
  stage: 5
  assertion: A deliberately broken candidate OS exhausts attempts and returns to the previous good slot.
- id: T-BOOT-003
  stage: 4
  assertion: No network link does not prevent mark-good when host/application boot health is otherwise satisfied.
- id: T-DATA-001
  stage: 4
  assertion: Database/settings written on one slot remain unchanged after booting the other slot.
- id: T-DATA-002
  stage: 4
  assertion: Repeated abrupt power cuts during writes do not produce unacceptable corruption on the selected v1 storage hardware.
- id: T-RUNTIME-001
  stage: 2
  assertion: Cold boot with all networking unavailable starts Epilykos from preloaded OCI images.
- id: T-RUNTIME-002
  stage: 2
  assertion: Epilykos container health failure prevents systemd readiness/RAUC confirmation.
- id: T-BLE-001
  stage: 3
  assertion: The Epilykos container reads a Bluetooth BMS and a BLE inverter module on test hardware without privileged=true,
    or an approved exception exists.
- id: T-UPDATE-001
  stage: 5
  assertion: Official signed RAUC bundle installs; invalid and wrong-CA bundles are rejected.
- id: T-UPDATE-002
  stage: 5
  assertion: Broken application candidate rolls back to previous digest without switching OS slot.
- id: T-UPDATE-003
  stage: 5
  assertion: OS rollback preserves DATA and active application-update state according to C-UPDATE-003.
- id: T-PROV-001
  stage: 1
  assertion: Fresh image is provisionable over Ethernet without terminal access.
- id: T-PROV-002
  stage: 1
  assertion: Wi-Fi setup works through BOOT/Imager files and Improv BLE without a captive portal; authenticated
    and no-address re-entry follow D-PROV-001.
- id: T-PROV-003
  stage: 6
  assertion: USB gadget setup is deferred from v1; test a supported board/port/host matrix only if separately approved
    later.
- id: T-LOG-001
  stage: 4
  assertion: Diagnostics bundle contains required evidence and no configured secrets.
- id: T-RECOVERY-001
  stage: 5
  assertion: Both failed Linux slots enter independent authenticated recovery automatically; offline signed repair
    preserves DATA and remains recoverable after interruption.
- id: T-BOOT-004
  stage: 4
  assertion: Corrupt or remove the U-Boot bootchooser environment and verify the documented deterministic recovery behavior
    without silently booting an arbitrary slot.
- id: T-UPDATE-004
  stage: 5
  assertion: A substituted/tampered or unauthorized application manifest is rejected before candidate OCI activation; a trusted/approved
    manifest proceeds to C-UPDATE-002 health/promotion logic.
- id: T-ACCESS-001
  stage: 4
  assertion: SSH is off by default, accepts configured password/public keys only for non-root epilykos when enabled,
    rejects root login and exposes no secrets.
- id: T-UPDATE-005
  stage: 5
  assertion: After promoting application sequence N, re-present a previously trusted/approved manifest with sequence <= N
    and verify rejection before OCI activation; then verify internal previous-known-good rollback still works without lowering
    the stored floor.
- id: T-BOOT-000
  stage: 0
  assertion: On the Tier 1 Pi 3B with a microSD card, the selected boot chain boots both slots, falls back after a forced
    failure and boots with no network.
- id: T-RELEASE-001
  stage: 2
  assertion: 'A stable manifest containing a digest whose record ref is dev (or with no record) fails the provenance check;
    an appliance image rejects a channel: dev manifest.'
- id: T-RUNTIME-003
  stage: 2
  assertion: Read-only container root permits approved DATA/bounded-scratch writes, normal startup/polling/password
    reset and production-size backup/restore/import/update flows without silent writable fallback.
- id: T-DATA-003
  stage: 4
  assertion: After an abrupt power cut during active polling, telemetry loss is within METRIC_FLUSH_INTERVAL_MS plus the synchronous-mode
    window and no configuration change is lost.
- id: T-HW-001
  stage: 1
  assertion: Each added Tier 2 board has pinned upstream support, logical A/B/DATA semantics and independent build/compatibility
    checks; a failed board artifact is withheld without blocking a valid Pi 3B artifact.
- id: T-RESOURCE-001
  stage: 2
  assertion: A 72-hour soak on the Tier 1 Pi 3B with active polling stays within the D-RESOURCE-001 budget with no host OOM
    kill; a forced application leak restarts only the container.
- id: T-TIME-001
  stage: 1
  assertion: On the Tier 1 Pi 3B, a cold boot with no network restores a clock not earlier than the last shutdown and reports
    it unsynchronised until NTP succeeds.
- id: T-BOOT-005
  stage: 5
  assertion: Physical power cuts and corrupt/hanging candidate bootloaders trigger automatic known-good early-chain
    recovery with no operator reset; Linux-only mocks do not count.
- id: T-BOOT-006
  stage: 4
  assertion: The single 20-minute userspace deadline covers startup and advances three candidate attempts via automatic
    reset/watchdog, followed by known-good fallback without network requirements.
- id: T-DATA-004
  stage: 4
  assertion: Production-size restore survives termination/power loss at each transition, restores a complete usable
    DB or its retained original and handles WAL/schema/migrations correctly.
- id: T-DATA-005
  stage: 4
  assertion: Compressed/legacy snapshots restore correctly; failed publication/pruning, disk exhaustion, clock changes
    and missed days preserve two successful copies and bounded operation.
- id: T-DATA-006
  stage: 4
  assertion: Unusable DATA still permits authenticated recovery diagnostics; no automatic formatting, database deletion
    or endless slot loop occurs.
- id: T-STORAGE-001
  stage: 4
  assertion: Warning/admission boundaries, growth/concurrency, incompressible input, expansion and ENOSPC preserve
    headroom/data/rollback assets with clear safe refusal.
- id: T-UPDATE-006
  stage: 5
  assertion: Signed OS installs from online/upload/USB work offline where applicable and reject wrong signer/board,
    tampering, incomplete content and incompatible boot-chain candidates.
- id: T-UPDATE-007
  stage: 5
  assertion: Complete app packages install with networking blocked; wrong content/platform/channel/replayed sequence
    and interrupted import/failed health do not authorize invalid promotion.
- id: T-LOG-002
  stage: 4
  assertion: Seeded secrets in structured status and logs never appear in bounded diagnostics; missing DATA/container/journal
    and hung collectors yield authorized partial output.
- id: T-RELEASE-002
  stage: 5
  assertion: Deliberate required-check/artifact/provenance failures suppress publication across every trigger; known
    emulator limitations remain diagnostic and routine publication has no manual approval gate.
decisions_required:
- id: D-BOOT-002
  blocks:
  - C-BOOT-000
  - C-BOOT-002
  question: Confirm U-Boot + RAUC bootchooser on the Tier 1 Pi 3B from C-BOOT-000 evidence; for Tier 2 boards, record
    which upstream boot mechanism (U-Boot, or Pi firmware tryboot/autoboot.txt with a RAUC custom backend) is adopted
    per board.
  due_stage: 0
  stage0_review_required: true
  status: resolved
  resolution: 'U-Boot + RAUC bootchooser on the Tier 1 Pi 3B: the 0.5.3 image booted on the maintainer''s board
    through the Pi firmware, U-Boot and boot.scr to multi-user from ROOT-A (2026-10-16). The slot-switch and forced-fallback
    evidence is still C-BOOT-000''s. Pi 4/5 select pinned upstream board boot/recovery support separately; no Pi
    3B mechanism is assumed portable.'
- id: D-HW-001
  blocks:
  - C-HW-001
  question: Which boards are tested (Tier 1) and which are best effort (Tier 2)?
  due_stage: 0
  stage0_review_required: true
  status: resolved
  resolution: 'Tier 1: Raspberry Pi 3 Model B (the only maintainer-owned board). Tier 2 best effort: Raspberry Pi
    4 and 5, using proven upstream board support. Complete Pi 3B first, then Pi 4, then Pi 5; best-effort boards
    do not block Pi 3B publication and their evidence level must be explicit.'
- id: D-PLATFORM-001
  blocks:
  - C-BOOT-000
  question: Choose the OS build system (Yocto or Buildroot). Prefer the option whose upstream already maintains
    A/B images for Pi 3, 4 and 5 (Home Assistant OS is Buildroot + RAUC on all three), since Tier 2 relies on that
    board support.
  due_stage: 0
  stage0_review_required: true
  status: resolved
  resolution: Buildroot, following Home Assistant OS's combination of Buildroot + U-Boot + RAUC across Pi 3/4/5
    (not a fork of its tree). Scaffolded as a BR2_EXTERNAL tree under os/; unbuilt and unverified until C-BOOT-000's
    hardware evidence exists.
- id: D-RECOVERY-001
  blocks:
  - C-RECOVERY-001
  - C-BOOT-001
  question: Include a dedicated recovery boot target in v1 or defer it and freeze a manual recovery procedure.
  due_stage: 0
  stage0_review_required: true
  status: resolved
  resolution: 'Superseded on 2026-10-17: v1 requires independent both-slots-failed recovery plus DATA-independent
    recovery UI. Automatic entry, authorized offline signed repair, DATA preservation and no endless counter-reset
    loop. Storage/credential/earliest-bootstrap design and hardware proof remain pending; no new partition or silent
    migration is approved.'
- id: D-STORAGE-001
  blocks:
  - C-BOOT-001
  question: 'Freeze exact BOOT/ROOT-A/ROOT-B/DATA sizes and filesystem types. Inputs: DATA must hold the database
    (a production install is ~5.9 GB), two retained snapshots, backup/restore staging (2x database) and the capped
    journal. The Tier 1 medium is a microSD card: include card capacity and endurance class in the decision.'
  due_stage: 0
  stage0_review_required: true
  status: resolved
  resolution: 'Medium: microSD, 32 GB minimum, 64 GB recommended, A1/A2 high-endurance class recommended. Layout:
    U-Boot environment raw at 4 MiB (two 16 KiB copies); BOOT 128 MiB FAT32; ROOT-A and ROOT-B 1536 MiB ext4 each,
    mounted read-only; DATA ext4 from the end of ROOT-B to the end of the card (grown on first boot). Snapshots
    are stored compressed. On a card below 32 GB the dashboard warns that snapshots and restore space may not fit.
    Pi 3B uses MBR. Maintenance warning/headroom and peak budgets follow C-STORAGE-001; do not double-count retained
    files or promise 32 GB fits every operation.'
- id: D-PROV-001
  blocks:
  - C-PROV-002
  - C-PROV-003
  question: Define the physical recovery gesture (must work on the Tier 1 Pi 3B) and, for Tier 2 USB gadget provisioning,
    the supported host OS matrix.
  due_stage: 1
  stage0_review_required: true
  status: resolved
  resolution: No physical gesture on Tier 1 (the Pi 3B has no button). Re-entry into Wi-Fi setup is either an authenticated
    "Change Wi-Fi" action in Epilykos settings, which opens Bluetooth LE setup (Improv) for 15 minutes, or automatic
    after the box has had no network address for 2 minutes. The Tier 2 USB-gadget host OS matrix is deferred with
    C-PROV-003.
- id: D-TIME-001
  blocks:
  - C-TIME-001
  question: Choose and configure the NTP implementation/server policy. Also define how clock-sync state and the
    provisioned time zone reach the application.
  due_stage: 1
  stage0_review_required: true
  status: resolved
  resolution: systemd-timesyncd; NTP servers from DHCP first, then pool.ntp.org. The last known time is kept on
    DATA and restored early in boot. The host exposes sync state to the container as a read-only file; the time
    zone is chosen in the setup wizard and passed to the container as TZ.
- id: D-RELEASE-001
  blocks:
  - C-RELEASE-001
  question: 'Freeze the release process: who may merge dev to main, version tag format, and how digest records are
    collected into a stable application manifest.'
  due_stage: 2
  stage0_review_required: true
  status: resolved
  resolution: 'Only the maintainer (ashipaek0) merges dev into main, in both repositories. Merging dev into main
    in the application repository is the release and everything after it is automatic: CI tags vX.Y.Z, publishes
    the digest records, updates and merges the stable application manifest in epilykos-os, and builds the stable
    OS image. Reliable automated gates govern publication; QEMU remains diagnostic until validated. No additional
    per-image manual hardware approval. Initial acceptance and targeted mechanism revalidation remain required.'
- id: D-RESOURCE-001
  blocks:
  - C-RESOURCE-001
  question: 'Freeze the Tier 1 memory budget: minimum steady-state free memory, Node.js heap cap, container memory
    limits and zram size. Input: Epilykos 2.7.0 measured ~100 MB peak RSS (92 MB steady) with an empty database
    on an x86-64 dev machine; re-measure on the Pi 3B with a production-size database and the Bluetooth helper running
    (it replaces the bms-bridge container).'
  due_stage: 2
  stage0_review_required: true
  status: resolved
  resolution: 'Epilykos container memory limit 640 MB; Node.js heap cap 384 MB (--max-old-space-size=384); zram
    swap 256 MB (zstd); no swap on the SD card. Target: at least 100 MB free memory steady-state, to be re-measured
    on the Pi 3B with a production-size database.'
- id: D-RUNTIME-001
  blocks:
  - C-RUNTIME-001
  question: Freeze epilykos UID/GID and subuid/subgid ranges.
  due_stage: 2
  stage0_review_required: true
  status: resolved
  resolution: 'Rootful Podman for v1; the application runs as uid/gid 1000 inside the container. No subuid/subgid
    ranges: rootless operation is dropped from v1.'
- id: D-BLE-001
  blocks:
  - C-RUNTIME-003
  question: Run Stage 3 D-Bus/BlueZ spike for the Epilykos container and record minimum privilege set and D-Bus
    policy.
  due_stage: 3
  stage0_review_required: true
  status: resolved
  resolution: 'No privileged container and no added capabilities: the application reaches host BlueZ over the system
    D-Bus (socket bind-mounted read-only), and a D-Bus policy lets uid 1000 talk to org.bluez only.'
- id: D-ACCESS-001
  blocks:
  - C-ACCESS-001
  question: 'Freeze dashboard-generated SSH key lifecycle: private-key delivery/export, persistent storage if any,
    rotation, revocation, and disable/re-enable semantics.'
  due_stage: 4
  stage0_review_required: true
  status: resolved
  resolution: SSH is off on a fresh box. An administrator turns it on in Epilykos settings; Raspberry Pi Imager's
    SSH settings or an authorized_keys file on BOOT turn it on at first boot. Login is user epilykos (sudo) with
    a password (set in the dashboard or by Imager) and/or public keys (pasted in the dashboard, from Imager, or
    authorized_keys on BOOT); the appliance does not generate keypairs. Root login stays disabled. Password and
    keys live on DATA; turning SSH off stops the server and keeps them; the dashboard can remove each key and clear
    the password.
- id: D-BOOT-001
  blocks:
  - C-BOOT-002
  question: Freeze U-Boot boot-attempt counts and environment storage/redundancy.
  due_stage: 4
  stage0_review_required: true
  status: resolved
  resolution: '3 boot attempts per slot (RAUC boot-attempts and boot-attempts-primary = 3). U-Boot environment raw
    on the SD card at 4 MiB and 4 MiB + 16 KiB, two redundant 16 KiB copies, matched by /etc/fw_env.config. Approved
    health deadline: one 20-minute userspace attempt, automatic reboot/watchdog, three candidate attempts then known-good
    fallback; timeout/physical reset implementation is pending.'
- id: D-LOG-001
  blocks:
  - C-LOG-001
  question: Freeze persistent journal storage cap.
  due_stage: 4
  stage0_review_required: true
  status: resolved
  resolution: Persistent journal on DATA, capped at 64 MB (SystemMaxUse=64M). Add authenticated bounded redacted
    local diagnostics in normal/recovery mode, excluding raw DB/secrets and automatic third-party transmission.
- id: D-SQLITE-001
  blocks:
  - C-DATA-003
  question: Freeze SQLite synchronous mode and periodic quick_check cadence. Current application default is NORMAL
    (explicit since app commit fabfa89).
  due_stage: 4
  stage0_review_required: true
  status: resolved
  resolution: synchronous=FULL on the appliance (SQLITE_SYNCHRONOUS=FULL). PRAGMA quick_check runs after every unclean
    shutdown and weekly, outside the boot-health gate.
- id: D-UPDATE-001
  blocks:
  - C-UPDATE-004
  question: 'Freeze the application-manifest authenticity model: signed manifest with pinned application-release
    trust anchor, or pinned/verified source plus authenticated per-candidate user approval; define v1 delivery paths.'
  due_stage: 5
  stage0_review_required: true
  status: resolved
  resolution: 'Signed manifests. CI signs each application release manifest with an Ed25519 key held in this repository''s
    secrets (APP_MANIFEST_SIGNING_KEY), after the manifest pull request is merged, so the signature covers exactly
    what the human trust decision accepted; separate from the RAUC release CA; appliances pin the public key and
    install a verified update when the administrator approves it, or automatically if enabled. Delivery: online
    check against the GitHub release, dashboard upload, or USB stick. Complete signed offline OCI packages are required.
    Custom server URLs and external application downgrade overrides are deferred from v1; internal rollback remains
    permitted without lowering the sequence floor.'
- id: D-VREVIEW-001
  blocks:
  - C-BOOT-004
  - C-STORAGE-001
  - C-DATA-004
  - C-DATA-005
  - C-UPDATE-005
  - C-UPDATE-006
  question: Record the 2026-10-17 approved v1 scope and explicit deferrals.
  due_stage: 5
  stage0_review_required: true
  status: resolved
  resolution: All 22 scope/policy choices are approved in plans/decisions/epilykos-os-v1-scope.md. This includes
    dedicated automatic early-chain recovery, independent recovery, native RAUC trust, manual OS install, large
    recoverable data maintenance, signed offline OCI packages, diagnostics, read-only container root and automatic
    reliable-gated publication. Implementation details and physical evidence remain pending; approved requirements
    do not imply feasibility tests passed.
test_fixture_notes:
- tests:
  - T-RUNTIME-001
  - C-DATA-002 evidence
  - C-NET-001 evidence
  note: These intentionally exercise overlapping offline-boot conditions from different contract perspectives. CI SHOULD reuse
    one network-isolated cold-boot fixture and record distinct assertions rather than build separate rigs.
decision_governance:
  ordering: The registry is ordered by due_stage then decision ID; list position is not priority.
  stage_0_rule: Stage 0 MUST review the complete open decision registry and confirm each decision's due_stage. Only decisions
    due at Stage 0 must be resolved before Stage 0 closes.
  stage_close_rule: A stage MUST NOT close while any open decision with due_stage less than or equal to that stage remains
    unresolved.
  late_added_rule: A decision added in a later contract revision receives the same review and gating semantics as an older
    decision; revision age has no effect on priority.
changelog:
- version: 0.7.2-draft
  changes:
  - 'C-RUNTIME-003: the Pi 3B Bluetooth UART runs at 921600 baud (hci_uart.max_speed, kernel patch) instead of the
    device tree''s 2000000 without flow control, which lost bytes; hostd bluetooth_recover restarts a stuck BlueZ at
    most once per 10 minutes.'
- version: 0.7.1-draft
  changes:
  - 'C-HOST-001: factory reset (settings, console, or factory-reset.txt on BOOT saying ERASE) erases DATA on the next
    boot and starts again as newly flashed.'
- version: 0.7.0-draft
  changes:
  - Record the 22 maintainer-approved v1 decisions from 2026-10-17; supersede older GPT, reflash-only recovery,
    rootless and provisioning/access proposals.
  - Require slot-contained Linux artifacts, automatic dedicated boot-chain recovery, independent both-slot/DATA
    recovery, recoverable multi-GB maintenance and complete signed offline packages; implementation/evidence remain
    pending.
  - Define operation-specific storage admission, diagnostics/read-only runtime, board order and automated publication
    without routine manual image approval; retain explicit v1 deferrals.
- version: 0.6.2-draft
  changes:
  - 'C-HOST-001: the dashboard port can be changed in settings (set_port); a forgotten dashboard password is replaced from
    BOOT or the console.'
  - 'C-PROV-002: Bluetooth is Low Energy only and not pairable; "Change Wi-Fi" after a completed setup no longer fails with
    "Maximum advertisements reached".'
  - 'Pi 3B hardware fixes: SSH password hashing (libcrypt.so.2), Wi-Fi power saving off, clock never before the build.'
- version: 0.6.1-draft
  changes:
  - 'C-HW-001: one image per board (Pi 4 and Pi 5 later, not yet built), not one image for all boards.'
  - 'C-RELEASE-001: stable images are hosted as GitHub Releases with the .zst image and a Raspberry Pi Imager OS list; test builds
    stay 14-day CI artifacts.'
- version: 0.6.0-draft
  changes:
  - 'C-HOST-001: application updates from Epilykos settings (update_status, update_check, update_apply); C-UPDATE-002
    implementation in epilykos_update. D-UPDATE-001: the signing key is held in epilykos-os, which signs after the merge,
    not in the application repository, so CI cannot sign a release no one has accepted.'
  - 'All fourteen open decisions resolved (2026-10-16): D-BOOT-001, D-BOOT-002, D-STORAGE-001, D-RECOVERY-001, D-PROV-001,
    D-TIME-001, D-RELEASE-001, D-RESOURCE-001, D-RUNTIME-001, D-BLE-001, D-ACCESS-001, D-LOG-001, D-SQLITE-001, D-UPDATE-001.'
  - 'C-BOOT-001: ROOT-A/B read-only and DATA repaired at boot, after power cuts damaged partitions on the first hardware
    test; sizes frozen (32 GB minimum card).'
  - 'C-ACCESS-001: SSH stays off by default but now supports password and key login for user epilykos; keys are supplied,
    not generated.'
  - 'C-PROV-002: Bluetooth LE (Improv) replaces the access-point portal; re-entry by dashboard action or network loss.'
  - 'C-RUNTIME-001 and C-DATA-002: rootful Podman for v1, application as uid 1000.'
  - 'C-RELEASE-001: merging dev into main in the application repository releases automatically.'
  - 'New C-HOST-001: Restart, Shut down, Change Wi-Fi and SSH in Epilykos settings through a narrow host interface; first-run
    setup no longer needs a code from the log.'
- version: 0.5.3-draft
  changes:
  - 'EpilykosOS Tier 1 image moves to AArch64: the application images are published for linux/amd64 and linux/arm64
    only, so the 32-bit userland could not run them.'
  - 'Boot fix from the first hardware boot: root=LABEL= needs an initramfs and panicked the kernel; boot.cmd now boots
    root=PARTUUID with a fixed disk signature and passes rauc.slot=. Layout is four primary MBR partitions; U-Boot
    environment moved from a FAT file to two raw redundant copies (C-BOOT-001, C-BOOT-002 implementation status).'
  - 'Image now carries networking (systemd-networkd DHCP, mDNS as epilykos.local), Bluetooth (BlueZ, onboard BCM43438 via
    the mainline serdev node and its firmware), and the Epilykos service with its image preloaded (C-RUNTIME-001,
    C-RUNTIME-002 implementation status). mark-good gates on C-BOOT-003 conditions.'
  - 'make contracts also checks the appliance launcher (os/board/*/rootfs-overlay/usr/bin/epilykos-run).'
  - 'Wi-Fi (iwd, networks kept on DATA) with three setup paths: wifi.txt on BOOT, Raspberry Pi Imager settings, and
    Bluetooth LE via the Improv Wi-Fi protocol (C-PROV-001, C-PROV-002 implementation status).'
- version: 0.5.2-draft
  changes:
  - 'Bluetooth moved into the epilykos container (application dev): the bms-bridge sidecar and irunmole/epilykos-bms image
    are retired. C-RUNTIME-003, I-006, T-BLE-001 and D-BLE-001 now apply to the epilykos container; C-RESOURCE-001 and
    D-RESOURCE-001 drop the separate container.'
  - 'C-UPDATE-002: bms-bridge is an optional legacy manifest entry; sync_app_release.py and make contracts require only
    epilykos.'
  - OS image adds host BlueZ (bluez5_utils) — the container reaches it over D-Bus.
- version: 0.5.1-draft
  changes:
  - 'D-PLATFORM-001 resolved: Buildroot, following Home Assistant OS''s combination of Buildroot + U-Boot + RAUC across
    Pi 3/4/5 (not a fork of its tree). Written comparison at evidence/stage-0/build-system-decision.md.'
  - 'Stage 0 build tree scaffolded under os/ (BR2_EXTERNAL): Pi 3B defconfig, U-Boot RAUC-bootchooser boot script, genimage
    A/B/DATA layout, first-boot DATA format+grow, C-BOOT-003 mark-good check. Untested — C-BOOT-000 stays blocked-on-spike
    until real hardware evidence exists.'
  - D-BOOT-002, D-STORAGE-001 and D-RECOVERY-001 remain open; the scaffold implements a proposal for each, not their
    resolution.
- version: 0.5-draft
  changes:
  - 'Hardware tiers (D-HW-001, resolved): Raspberry Pi 3B is the only tested board (Tier 1); Pi 4 and Pi 5 are best effort
    (Tier 2) on proven upstream board support. New I-010, C-HW-001, T-HW-001.'
  - 'Pi 5 assumptions removed: Stage 0 boot spike and all gating hardware tests run on the Pi 3B; microSD is the Tier 1 v1
    medium.'
  - 'C-TIME-001: boards without an RTC persist and restore the last known time and report the clock unsynchronised until NTP;
    T-TIME-001.'
  - C-PROV-003 USB gadget provisioning is Tier 2 only (Pi 3B USB is host-only) and no longer gates Stage 1.
  - 'New C-RESOURCE-001 / D-RESOURCE-001 / T-RESOURCE-001: 1 GB memory budget, heap and container limits, zram only, OOM policy.'
  - 'C-RUNTIME-003: Pi 3B Bluetooth/UART note; D-PLATFORM-001 prefers an upstream that already maintains Pi 3/4/5 A/B images.'
- version: 0.4-draft
  changes:
  - 'Repository split: OS contract, image build and CI live in epilykos-os; application changes land in ashipaek0/epilykos
    dev.'
  - 'Branch model: dev = integration, main = stable releases (both repositories). New I-009, C-RELEASE-001, D-RELEASE-001,
