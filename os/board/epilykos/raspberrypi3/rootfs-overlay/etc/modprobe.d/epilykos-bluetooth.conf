# The Pi 3B's onboard Bluetooth sits on the PL011 UART with no hardware
# flow control. At the device tree's 2000000 baud, bytes are lost whenever
# the CPU is late to the interrupt (overruns in /proc/tty/driver/ttyAMA,
# "Frame reassembly failed" and HCI command timeouts), and BlueZ is left
# waiting on an operation that never finishes. 921600 baud is what
# Raspberry Pi OS uses for this board without flow control.
# hci_uart.max_speed comes from patches/linux/0001 (C-RUNTIME-003).
options hci_uart max_speed=921600
