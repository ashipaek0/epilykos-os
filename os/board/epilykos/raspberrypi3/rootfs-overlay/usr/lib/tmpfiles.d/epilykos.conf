# Persistent layout on DATA (C-DATA-001, C-DATA-002). tmpfiles runs after
# local-fs.target, so /data is mounted by then.
d /data/rauc               0755 root root -
d /data/containers         0700 root root -
d /data/containers/tmp     0700 root root -
d /data/epilykos           0755 root root -
# The application's /app/data; the container's app user is uid/gid 1000.
d /data/epilykos/app-data  0755 1000 1000 -
# Application updates from settings (epilykos_update): root only.
d /data/epilykos/updater   0700 root root -
# OS updates from settings (epilykos_os_update): private journal and
# package staging, and the public guard the app reads (read-only mount).
d /data/epilykos/os-updater          0755 root root -
d /data/epilykos/os-updater/private  0700 root root -
d /data/epilykos/os-updater/public   0755 root root -
# Known Wi-Fi networks (iwd's state, bind-mounted for it) and the Wi-Fi
# country.
d /data/iwd                0700 root root -
d /data/network            0755 root root -
# SSH maintenance login (C-ACCESS-001): settings and keys, and the home
# directory of user epilykos.
d /data/ssh                0755 root root -
d /data/home               0755 root root -
d /data/home/epilykos      0700 epilykos epilykos -
