name: OS tree structural check

# NOT a real build: a real Buildroot build downloads several GB (kernel,
# toolchain, package sources) and commonly takes over an hour, well past
# what's reasonable to run on every push. This only lints the os/ tree
# for the mistakes that don't need a build to catch — see os/README.md
# for actually building an image.

on:
  push:
    paths:
      - 'os/**'
      - '.github/workflows/os-build-check.yml'
  pull_request:
    paths:
      - 'os/**'
      - '.github/workflows/os-build-check.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Script syntax check
        run: |
          set -e
          for f in os/build.sh \
                   os/board/epilykos/raspberrypi3/post-build.sh \
                   os/board/epilykos/raspberrypi3/post-image.sh \
                   os/board/epilykos/raspberrypi3/rootfs-overlay/usr/bin/*; do
            case "$(head -n1 "$f")" in
              *python3*) echo "parse $f"; python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f" ;;
              *) echo "sh -n $f"; sh -n "$f" ;;
            esac
          done
          for f in os/board/epilykos/raspberrypi3/rootfs-overlay/usr/lib/epilykos/python/*.py; do
            echo "parse $f"; python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f"
          done
      - name: Executable bits on scripts
        run: |
          set -e
          for f in os/build.sh \
                   os/board/epilykos/raspberrypi3/post-build.sh \
                   os/board/epilykos/raspberrypi3/post-image.sh \
                   os/board/epilykos/raspberrypi3/rootfs-overlay/usr/bin/*; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
          done
      - name: Every path a defconfig/genimage references exists in-tree
        run: |
          set -e
          test -f os/configs/epilykos_raspberrypi3_defconfig
          for rel in board/epilykos/raspberrypi3/linux.fragment \
                     board/epilykos/raspberrypi3/config.txt \
                     board/epilykos/raspberrypi3/boot.cmd \
                     board/epilykos/raspberrypi3/uboot.fragment \
                     board/epilykos/raspberrypi3/rootfs-overlay \
                     board/epilykos/raspberrypi3/post-build.sh \
                     board/epilykos/raspberrypi3/post-image.sh \
                     board/epilykos/raspberrypi3/genimage.cfg; do
            test -e "os/$rel" || { echo "missing os/$rel"; exit 1; }
          done
      - name: Units and presets
        run: |
          set -e
          OVERLAY=os/board/epilykos/raspberrypi3/rootfs-overlay
          # Buildroot runs `systemctl preset-all` after copying the overlay,
          # which deletes hand-made enable symlinks; units are enabled
          # through the preset file instead.
          if find "$OVERLAY/etc/systemd/system" -name '*.wants' 2>/dev/null | grep -q .; then
            echo "enable units via $OVERLAY/usr/lib/systemd/system-preset, not .wants symlinks"; exit 1
          fi
          for unit in "$OVERLAY"/usr/lib/systemd/system/epilykos*.service; do
            name=$(basename "$unit")
            grep -qx "enable $name" "$OVERLAY"/usr/lib/systemd/system-preset/50-epilykos.preset \
              || { echo "$name is not enabled in 50-epilykos.preset"; exit 1; }
            for cmd in $(sed -n 's/^Exec[A-Za-z]*=-\{0,1\}\(\/usr\/bin\/epilykos[^ ]*\).*/\1/p' "$unit"); do
              test -x "$OVERLAY$cmd" || { echo "$name runs $cmd, which is not in the overlay"; exit 1; }
            done
          done
          systemd-analyze verify --man=no "$OVERLAY"/usr/lib/systemd/system/epilykos*.service 2>&1 \
            | grep -v 'is not executable\|bluetooth.service\|rauc.service\|podman' | tee verify.log
          test ! -s verify.log
      - name: Wi-Fi setup over Bluetooth (Improv) against fake BlueZ and iwd
        run: |
          set -e
          pip install dbus-fast==4.0.4
          python3 tools/test_wifi_provisioning.py
          python3 tools/test_improv_dbus.py
