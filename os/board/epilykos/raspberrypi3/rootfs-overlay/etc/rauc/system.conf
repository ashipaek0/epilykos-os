# RAUC system configuration — Raspberry Pi 3B (Tier 1).
#
# Slots are addressed by PARTUUID (fixed disk signature 0x45504c4b, see
# genimage.cfg). Filesystem labels can't be used: installing a bundle
# writes the bundle's filesystem, label included, into the target slot.
# The booted slot is identified from rauc.slot= on the kernel command
# line, set by boot.cmd.
#
# No [keyring] yet: bundle signing is Stage 5 (C-UPDATE-004). Until a
# keyring exists `rauc install` refuses every bundle, which is the safe
# default; `rauc status` and mark-good work without it.

[system]
compatible=epilykos-raspberrypi3
bootloader=uboot
data-directory=/data/rauc
# C-BOOT-002: explicit, and equal to the reset value boot.cmd uses.
boot-attempts=3
boot-attempts-primary=3

[slot.rootfs.0]
device=/dev/disk/by-partuuid/45504c4b-02
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/45504c4b-03
type=ext4
bootname=B
