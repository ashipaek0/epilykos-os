<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- D-BLE-001: the Epilykos app (uid 1000 inside its container, user
     epilykos on the host) may talk to BlueZ on the system bus, and to
     nothing else that isn't open to every user already. -->
<busconfig>
  <policy user="epilykos">
    <allow send_destination="org.bluez"/>
    <allow receive_sender="org.bluez"/>
  </policy>
</busconfig>
